<h1>🧠 Quiz</h1><p class="muted">Choose a level. Your answer locks after one click. Correct answers are green and incorrect answers are red.</p>
<div class="card"><div class="levels"><button class="level active" onclick="start('Starter')">Starter</button><button class="level" onclick="start('A1')">A1</button><button class="level" onclick="start('A2')">A2</button><button class="level" onclick="start('B1')">B1</button><button class="level" onclick="start('B1+')">B1+</button><button class="level" onclick="start('B2')">B2</button></div>
<h2>⏱️ <span id="timer">00:00</span></h2><h2 id="q"></h2><div id="a"></div><p id="r"></p><button class="btn" id="next" style="display:none" onclick="next()">Next →</button></div>
<script>
const qs={Starter:[["What is the opposite of big?",["small","old","slow"],0],["I ___ a student.",["am","is","are"],0],["Book means...",["kitob","qalam","uy"],0]],A1:[["She ___ English.",["study","studies","studying"],1],["Past of go?",["goed","went","go"],1],["Cheap means...",["arzon","qimmat","og‘ir"],0]],A2:[["Improve means...",["yaxshilamoq","yo‘qotmoq","kutmoq"],0],["I have ___ London.",["visited","visit","visiting"],0],["Opposite of borrow?",["lend","keep","find"],0]],B1:[["Achieve means...",["erishmoq","unutmoq","kutmoq"],0],["Frequent means...",["tez-tez","kamdan-kam","qimmat"],0],["She has been ___ English.",["studying","study","studied"],0]],"B1+":[["Encounter means...",["duch kelmoq","yashirmoq","unutmoq"],0],["Nevertheless is closest to...",["however","because","therefore"],0],["Considerable means...",["sezilarli","juda kichik","tasodifiy"],0]],B2:[["Substantial means...",["sezilarli","oddiy","qisqa"],0],["Whereas shows...",["contrast","time","place"],0],["I would have come if I ___ known.",["had","have","has"],0]]};let lv="Starter",i=0,score=0,startTime=0,timerId;
function start(x){lv=x;i=0;score=0;startTime=Date.now();clearInterval(timerId);timerId=setInterval(()=>{let s=Math.floor((Date.now()-startTime)/1000);timer.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},250);render()}
function render(){let x=qs[lv][i];q.textContent=(i+1)+". "+x[0];a.innerHTML="";r.textContent="";next.style.display="none";x[1].forEach((v,j)=>{let b=document.createElement("button");b.className="btn";b.style="display:block;margin:7px 0;width:100%;text-align:left";b.textContent=v;b.onclick=()=>{document.querySelectorAll("#a button").forEach(z=>z.disabled=true);if(j===x[2]){b.style.background="#22c55e";b.style.color="white";r.textContent="✅ Correct";score++}else{b.style.background="#ef4444";b.style.color="white";document.querySelectorAll("#a button")[x[2]].style.background="#22c55e";r.textContent="❌ Incorrect"}next.style.display="inline-block"};a.appendChild(b)})}
function next(){i++;if(i<qs[lv].length)render();else{clearInterval(timerId);alert("Finished! Score: "+score+"/"+qs[lv].length);start(lv)}}start("Starter");
</script>
</main><footer>Learn English with Mr. Ibrohim • Free English learning</footer></body></html>

<h1>🎧 Listening Practice</h1><p class="muted">No new tab. Choose a level, voice and continue from your saved position.</p>
<div class="card"><div class="levels"><button class="level active" onclick="load('Starter')">Starter</button><button class="level" onclick="load('A1')">A1</button><button class="level" onclick="load('A2')">A2</button><button class="level" onclick="load('B1')">B1</button><button class="level" onclick="load('B1+')">B1+</button><button class="level" onclick="load('B2')">B2</button></div>
<h2 id="title">Starter</h2><h3><span id="time">00:00</span> / <span id="total">00:00</span></h3>
<div style="height:10px;background:#ffffff33;border-radius:20px"><div id="bar" style="height:100%;width:0;background:#22c55e;border-radius:20px"></div></div><br>
<label>🎙️ Voice </label><select id="voice"><option>Female</option><option>Male</option><option>Girl</option><option>Boy</option></select>
<label> ⚡ Speed </label><select id="speed"><option>.75</option><option selected>.85</option><option>1</option><option>1.15</option></select><br><br>
<button class="btn" onclick="play()">▶ Play / Continue</button> <button class="btn" onclick="stop()">■ Stop</button>
</div>
<div class="card"><h2>📝 Transcript</h2><div id="text"></div></div>
<script>
const lessons={Starter:"Hello. My name is Alex. I am a student. I live in London. Every morning, I get up at seven o'clock. I have breakfast and go to school.",A1:"My name is Sara. I usually go to the library after school. We study English for about one hour. After that, we walk home together.",A2:"Last Saturday, Daniel planned to visit his cousin. The weather was rainy in the morning, so he stayed at home. In the afternoon, the rain stopped and he took the bus.",B1:"Many students find it difficult to study consistently when they have a busy schedule. A realistic routine and short daily practice can be more effective than one long session each week.","B1+":"Learning a language is not simply a matter of memorising long lists of vocabulary. Learners need repeated exposure to words in meaningful contexts.","B2":"Digital tools have made language learning more accessible, but technology does not automatically make learning effective. Active practice, clear goals and reviewing mistakes still matter."};let lv="Starter",sent=[],i=0;
function load(x){stop();lv=x;sent=lessons[lv].match(/[^.!?]+[.!?]+/g)||[lessons[lv]];i=Math.min(+localStorage.getItem("pos_"+lv)||0,sent.length-1);title.textContent=lv+" Listening";text.innerHTML=sent.map((s,j)=>`<p onclick="jump(${j})" style="padding:8px;border-radius:8px;cursor:pointer">${s}</p>`).join("");update()}
function duration(s){return Math.max(2,s.split(/\s+/).length/(2.3*+speed.value))}
function totalSec(){return sent.reduce((a,s)=>a+duration(s),0)}
function elapsed(){return sent.slice(0,i).reduce((a,s)=>a+duration(s),0)}
function fmt(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function update(){time.textContent=fmt(elapsed());total.textContent=fmt(totalSec());bar.style.width=(elapsed()/totalSec()*100)+"%";[...text.children].forEach((p,j)=>p.style.background=j===i?"#22c55e33":"transparent")}
function voicePick(){let type=voice.value.toLowerCase(),vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)),female=/female|woman|samantha|karen|victoria|zira|aria|libby/i,male=/male|man|daniel|alex|david|george|guy|ryan/i;return vs.find(v=>(type==="female"||type==="girl"?female:male).test(v.name))||vs.find(v=>/en-gb/i.test(v.lang))||vs[0]}
function play(){stop();let u=new SpeechSynthesisUtterance(sent[i]);u.lang="en-GB";u.rate=+speed.value;u.pitch=/Girl|Boy/.test(voice.value)?1.08:1;let v=voicePick();if(v)u.voice=v;u.onend=()=>{if(i<sent.length-1){i++;save();update();play()}else{save();update()}};speechSynthesis.speak(u)}
function stop(){speechSynthesis.cancel()}
function save(){localStorage.setItem("pos_"+lv,i)}
function jump(j){stop();i=j;save();update()}load("Starter");
</script>
</main><footer>Learn English with Mr. Ibrohim • Free English learning</footer></body></html>
